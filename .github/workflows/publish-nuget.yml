name: Publish NuGet Packages

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
      env:
        DOTNET_INSTALL_DIR: ./dotnet
        NUGET_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}

    - name: Restore dependencies
      run: dotnet restore Extensions.slnx
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}

    - name: Build
      run: dotnet build Extensions.slnx --configuration Release --no-restore

    - name: Pack
      run: |
        dotnet pack Extensions.Domain/Extensions.Domain.csproj --configuration Release --no-build --output nupkgs
        dotnet pack Extensions.Application/Extensions.Application.csproj --configuration Release --no-build --output nupkgs
        dotnet pack Extensions.Infrastructure/Extensions.Infrastructure.csproj --configuration Release --no-build --output nupkgs

    - name: Publish to GitHub Packages
      run: dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate --api-key ${{ env.GHCR_TOKEN }}
